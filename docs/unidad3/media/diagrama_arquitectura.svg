  <g fill="#475569" font-size="11" text-anchor="middle">
    <text x="470" y="236">eventos</text>
    <text x="920" y="258">guardado</text>
    <text x="920" y="452">envío</text>
  </g>

  <path d="M 245 782 L 245 822 Q 245 830 253 830 L 1137 830 Q 1145 830 1145 822 L 1145 654" fill="none" stroke="#f59e0b" stroke-width="2.5" stroke-dasharray="8 6" marker-end="url(#flechaAmbar)"/>
  <text x="700" y="822" text-anchor="middle" font-size="13" fill="#475569">Publicación: GitHub Pages sirve el sitio completo</text>

  <text x="700" y="872" text-anchor="middle" font-size="12" fill="#475569">Las flechas indican el flujo de eventos y datos entre capas</text>
