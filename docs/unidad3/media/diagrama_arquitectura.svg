    <rect x="517" y="322" width="6" height="64" rx="3"/>
    <rect x="517" y="438" width="6" height="64" rx="3"/>
    <rect x="517" y="554" width="6" height="64" rx="3"/>
    <rect x="517" y="670" width="6" height="64" rx="3"/>
  </g>
