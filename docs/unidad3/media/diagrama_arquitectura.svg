    <rect x="55" y="308" width="380" height="50" rx="14"/>
    <rect x="55" y="368" width="380" height="50" rx="14"/>
    <rect x="55" y="428" width="380" height="50" rx="14"/>
    <rect x="55" y="488" width="380" height="50" rx="14"/>
    <rect x="55" y="548" width="380" height="50" rx="14"/>
    <rect x="55" y="608" width="380" height="50" rx="14"/>
    <rect x="55" y="668" width="380" height="50" rx="14"/>
    <rect x="55" y="728" width="380" height="50" rx="14"/>

    <rect x="505" y="188" width="380" height="100" rx="14"/>
    <rect x="505" y="304" width="380" height="100" rx="14"/>
