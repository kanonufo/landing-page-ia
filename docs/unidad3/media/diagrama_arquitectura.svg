    <text x="990" y="396" font-size="21" font-weight="700" fill="#0f172a">POST a Formspree</text>
    <text x="990" y="426" font-size="14" fill="#475569">Envío del formulario</text>
    <text x="990" y="450" font-size="14" fill="#475569">de registro por correo</text>
    <text x="990" y="556" font-size="21" font-weight="700" fill="#0f172a">GitHub Pages</text>
    <text x="990" y="586" font-size="14" fill="#475569">Hosting estático</text>
    <text x="990" y="610" font-size="14" fill="#475569">Publicación del sitio</text>
  </g>

  <g fill="none" stroke="#475569" stroke-width="2">
    <path d="M 439 273 L 501 242" marker-end="url(#flecha)"/>
    <path d="M 439 513 L 501 500" marker-end="url(#flecha)"/>
    <path d="M 439 573 L 501 586" marker-end="url(#flecha)"/>
    <path d="M 439 633 C 478 633, 462 354, 501 354" marker-end="url(#flecha)"/>
    <path d="M 887 344 C 924 344, 916 268, 953 268" marker-end="url(#flecha)"/>
    <path d="M 887 368 C 924 368, 916 428, 953 428" marker-end="url(#flecha)"/>
