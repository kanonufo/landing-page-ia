    <text x="540" y="346" font-size="19" font-weight="700" fill="#0f172a">form-persistence.js</text>
    <text x="540" y="376" font-size="14" fill="#475569">Guarda y restaura el registro</text>
    <text x="540" y="462" font-size="19" font-weight="700" fill="#0f172a">faq.js</text>
    <text x="540" y="492" font-size="14" fill="#475569">Acordeón de preguntas frecuentes</text>
    <text x="540" y="578" font-size="19" font-weight="700" fill="#0f172a">countdown.js</text>
    <text x="540" y="608" font-size="14" fill="#475569">Temporizador de la oferta</text>
    <text x="540" y="694" font-size="19" font-weight="700" fill="#0f172a">scroll-progress.js</text>
    <text x="540" y="724" font-size="14" fill="#475569">Barra de progreso de lectura</text>
  </g>

