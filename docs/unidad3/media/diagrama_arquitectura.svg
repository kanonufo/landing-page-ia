<svg xmlns="http://www.w3.org/2000/svg" version="1.1" width="1400" height="900" viewBox="0 0 1400 900" font-family="Inter, 'Segoe UI', Arial, sans-serif" role="img">
  <title>Arquitectura de la landing page</title>
  <desc>Diagrama de arquitectura de la landing page en tres capas: HTML, JavaScript IIFE y datos y despliegue.</desc>
  <defs>
    <marker id="flecha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#475569"/>
    </marker>
    <marker id="flechaAmbar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#f59e0b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1400" height="900" fill="#f8fafc"/>
  <rect x="1" y="1" width="1398" height="898" fill="none" stroke="#e2e8f0" stroke-width="2"/>

  <text x="700" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#0f172a">Arquitectura de la landing page</text>
  <text x="700" y="88" text-anchor="middle" font-size="15" fill="#475569">Tres capas: estructura HTML, comportamiento JavaScript y datos con despliegue</text>
  <rect x="620" y="98" width="160" height="4" rx="2" fill="#f59e0b"/>

  <text x="245" y="116" text-anchor="middle" font-size="12" font-weight="700" letter-spacing="3" fill="#475569">CAPA 1</text>
  <text x="695" y="116" text-anchor="middle" font-size="12" font-weight="700" letter-spacing="3" fill="#475569">CAPA 2</text>
  <text x="1145" y="116" text-anchor="middle" font-size="12" font-weight="700" letter-spacing="3" fill="#475569">CAPA 3</text>

  <rect x="55" y="124" width="380" height="48" rx="14" fill="#2563eb"/>
  <text x="245" y="155" text-anchor="middle" font-size="20" font-weight="700" fill="#ffffff">HTML</text>
  <rect x="505" y="124" width="380" height="48" rx="14" fill="#1d4ed8"/>
  <text x="695" y="155" text-anchor="middle" font-size="20" font-weight="700" fill="#ffffff">JavaScript (IIFE)</text>
  <rect x="955" y="124" width="380" height="48" rx="14" fill="#f59e0b"/>
  <text x="1145" y="155" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">Datos y despliegue</text>

