<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" version="1.1" role="img" aria-labelledby="titulo desc" font-family="Inter, 'Segoe UI', Arial, sans-serif">
  <title id="titulo">Flujo de persistencia del formulario</title>
  <desc id="desc">Diagrama de tres carriles que muestra el autoguardado del formulario en localStorage, el envío al servicio externo Formspree y la limpieza de claves tras la conversión.</desc>
  <defs>
    <marker id="flechaAzul" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <marker id="flechaAmbar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#f59e0b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1400" height="900" fill="#ffffff"/>

  <text x="700" y="44" text-anchor="middle" font-size="26" font-weight="bold" fill="#0f172a">Flujo de persistencia del formulario</text>
  <text x="700" y="68" text-anchor="middle" font-size="13" fill="#475569">Autoguardado, restauración y conversión del visitante</text>

  <rect x="30" y="84" width="370" height="780" rx="14" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
  <rect x="410" y="84" width="350" height="780" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
  <rect x="770" y="84" width="360" height="780" rx="14" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>

  <text x="215" y="118" text-anchor="middle" font-size="16" font-weight="bold" fill="#0f172a">Visitante</text>
  <rect x="175" y="126" width="80" height="4" rx="2" fill="#2563eb"/>
  <text x="585" y="118" text-anchor="middle" font-size="16" font-weight="bold" fill="#0f172a">localStorage</text>
  <rect x="545" y="126" width="80" height="4" rx="2" fill="#1d4ed8"/>
  <text x="950" y="118" text-anchor="middle" font-size="16" font-weight="bold" fill="#0f172a">Servicio externo (Formspree)</text>
  <rect x="910" y="126" width="80" height="4" rx="2" fill="#f59e0b"/>

  <rect x="1150" y="84" width="220" height="360" rx="14" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="1260" y="114" text-anchor="middle" font-size="15" font-weight="bold" fill="#0f172a">Claves utilizadas</text>
  <text x="1260" y="132" text-anchor="middle" font-size="11" fill="#475569">localStorage del navegador</text>

  <rect x="1164" y="146" width="192" height="44" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.2"/>
  <circle cx="1180" cy="168" r="4" fill="#2563eb"/>
  <text x="1192" y="172" font-size="11" fill="#0f172a">resumia_form_nombre</text>

  <rect x="1164" y="202" width="192" height="44" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.2"/>
  <circle cx="1180" cy="224" r="4" fill="#2563eb"/>
  <text x="1192" y="228" font-size="11" fill="#0f172a">resumia_form_email</text>

  <rect x="1164" y="258" width="192" height="44" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.2"/>
  <circle cx="1180" cy="280" r="4" fill="#2563eb"/>
  <text x="1192" y="284" font-size="11" fill="#0f172a">resumia_form_rol</text>

  <rect x="1164" y="314" width="192" height="44" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.2"/>
  <circle cx="1180" cy="336" r="4" fill="#2563eb"/>
  <text x="1192" y="340" font-size="11" fill="#0f172a" textLength="150" lengthAdjust="spacingAndGlyphs">resumia_form_consentimiento</text>

  <rect x="1164" y="370" width="192" height="44" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.2"/>
  <circle cx="1180" cy="392" r="4" fill="#f59e0b"/>
  <text x="1192" y="396" font-size="11" fill="#0f172a" textLength="150" lengthAdjust="spacingAndGlyphs">resumia_usuario_convertido</text>

  <text x="1260" y="434" text-anchor="middle" font-size="10" fill="#475569">Se limpian al completar la conversión</text>

  <path d="M 215 202 L 215 230" fill="none" stroke="#2563eb" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#flechaAzul)"/>
  <path d="M 380 263 H 585 V 322" fill="none" stroke="#2563eb" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#flechaAzul)"/>
  <path d="M 425 355 H 215 V 414" fill="none" stroke="#2563eb" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#flechaAzul)"/>
  <path d="M 380 447 H 950 V 506" fill="none" stroke="#f59e0b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#flechaAmbar)"/>
  <path d="M 950 570 L 950 598" fill="none" stroke="#f59e0b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#flechaAmbar)"/>
  <path d="M 785 631 H 585 V 690" fill="none" stroke="#2563eb" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#flechaAzul)"/>
  <path d="M 425 723 H 215 V 782" fill="none" stroke="#2563eb" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#flechaAzul)"/>

  <g>
    <rect x="50" y="140" width="330" height="62" rx="14" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
    <circle cx="80" cy="171" r="15" fill="#2563eb"/>
    <text x="80" y="176" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">1</text>
    <text x="104" y="168" font-size="14" font-weight="bold" fill="#0f172a">Llega a la landing</text>
    <text x="104" y="187" font-size="12" fill="#475569">Primera visita al sitio</text>
  </g>

  <g>
    <rect x="50" y="232" width="330" height="62" rx="14" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
    <circle cx="80" cy="263" r="15" fill="#2563eb"/>
    <text x="80" y="268" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">2</text>
    <text x="104" y="260" font-size="14" font-weight="bold" fill="#0f172a">Escribe en el formulario</text>
    <text x="104" y="279" font-size="12" fill="#475569">Evento input en cada campo</text>
  </g>

  <g>
    <rect x="425" y="324" width="320" height="62" rx="14" fill="#ffffff" stroke="#1d4ed8" stroke-width="1.5"/>
    <circle cx="455" cy="355" r="15" fill="#1d4ed8"/>
    <text x="455" y="360" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">3</text>
    <text x="479" y="352" font-size="14" font-weight="bold" fill="#0f172a">Autoguardado</text>
    <text x="479" y="371" font-size="12" fill="#475569">Claves resumia_form_*</text>
  </g>

  <g>
    <rect x="50" y="416" width="330" height="62" rx="14" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
    <circle cx="80" cy="447" r="15" fill="#2563eb"/>
    <text x="80" y="452" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">4</text>
    <text x="104" y="444" font-size="14" font-weight="bold" fill="#0f172a">Recarga de la pagina</text>
    <text x="104" y="463" font-size="12" fill="#475569">Restauración automatica</text>
  </g>

  <g>
    <rect x="785" y="508" width="330" height="62" rx="14" fill="#ffffff" stroke="#f59e0b" stroke-width="1.5"/>
    <circle cx="815" cy="539" r="15" fill="#f59e0b"/>
    <text x="815" y="544" text-anchor="middle" font-size="14" font-weight="bold" fill="#0f172a">5</text>
    <text x="839" y="536" font-size="14" font-weight="bold" fill="#0f172a">Envío POST con fetch</text>
    <text x="839" y="555" font-size="12" fill="#475569">Datos del formulario</text>
  </g>

  <g>
    <rect x="785" y="600" width="330" height="62" rx="14" fill="#ffffff" stroke="#f59e0b" stroke-width="1.5"/>
    <circle cx="815" cy="631" r="15" fill="#f59e0b"/>
    <text x="815" y="636" text-anchor="middle" font-size="14" font-weight="bold" fill="#0f172a">6</text>
    <text x="839" y="628" font-size="14" font-weight="bold" fill="#0f172a">Respuesta 200</text>
    <text x="839" y="647" font-size="12" fill="#475569">Envío confirmado</text>
  </g>

  <g>
    <rect x="425" y="692" width="320" height="62" rx="14" fill="#ffffff" stroke="#1d4ed8" stroke-width="1.5"/>
    <circle cx="455" cy="723" r="15" fill="#1d4ed8"/>
    <text x="455" y="728" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">7</text>
    <text x="479" y="720" font-size="14" font-weight="bold" fill="#0f172a">Limpieza de claves</text>
    <text x="479" y="739" font-size="12" fill="#475569">Marca resumia_usuario_convertido</text>
  </g>

  <g>
    <rect x="50" y="784" width="330" height="62" rx="14" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
    <circle cx="80" cy="815" r="15" fill="#2563eb"/>
    <text x="80" y="820" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">8</text>
    <text x="104" y="812" font-size="14" font-weight="bold" fill="#0f172a">Próxima visita</text>
    <text x="104" y="831" font-size="12" fill="#475569">Agradecimiento personalizado</text>
  </g>
</svg>
