<svg xmlns="http://www.w3.org/2000/svg" width="560" height="420" viewBox="0 0 560 420" role="img" aria-label="Un PDF se transforma en un resumen con vinetas">
  <defs>
    <linearGradient id="fondo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#eef2ff"/>
      <stop offset="100%" stop-color="#f5f3ff"/>
    </linearGradient>
    <linearGradient id="marca" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="barra" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <filter id="sombra" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#1e293b" flood-opacity="0.15"/>
    </filter>
  </defs>

  <rect width="560" height="420" fill="url(#fondo)"/>

  <circle cx="470" cy="70" r="90" fill="#7c3aed" fill-opacity="0.08"/>
  <circle cx="90" cy="360" r="80" fill="#2563eb" fill-opacity="0.08"/>

  <!-- Documento PDF (entrada) -->
  <g filter="url(#sombra)">
    <rect x="60" y="80" width="180" height="240" rx="16" fill="#ffffff"/>
    <rect x="60" y="80" width="180" height="52" rx="16" fill="url(#marca)"/>
    <rect x="60" y="116" width="180" height="16" fill="url(#marca)"/>
    <text x="88" y="115" font-family="system-ui,Segoe UI,Roboto,sans-serif" font-size="20" font-weight="700" fill="#ffffff">PDF</text>
    <g fill="#cbd5e1">
      <rect x="84" y="160" width="132" height="10" rx="5"/>
      <rect x="84" y="182" width="132" height="10" rx="5"/>
      <rect x="84" y="204" width="110" height="10" rx="5"/>
      <rect x="84" y="226" width="132" height="10" rx="5"/>
      <rect x="84" y="248" width="90" height="10" rx="5"/>
      <rect x="84" y="270" width="120" height="10" rx="5"/>
    </g>
  </g>

  <!-- Flecha / IA -->
  <g>
    <path d="M255 200 h50" stroke="url(#barra)" stroke-width="6" stroke-linecap="round"/>
    <path d="M295 188 l14 12 -14 12" fill="none" stroke="url(#barra)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="280" cy="200" r="34" fill="#ffffff" stroke="url(#barra)" stroke-width="4"/>
    <path d="M280 182 l4.5 13 13 4.5 -13 4.5 -4.5 13 -4.5 -13 -13 -4.5 13 -4.5 z" fill="url(#marca)"/>
  </g>

  <!-- Resumen (salida) -->
  <g filter="url(#sombra)">
    <rect x="330" y="110" width="180" height="200" rx="16" fill="#ffffff"/>
    <rect x="352" y="138" width="120" height="12" rx="6" fill="url(#marca)"/>
    <g>
      <circle cx="360" cy="182" r="7" fill="url(#marca)"/>
      <rect x="378" y="175" width="104" height="10" rx="5" fill="#94a3b8"/>
      <circle cx="360" cy="214" r="7" fill="url(#marca)"/>
      <rect x="378" y="207" width="112" height="10" rx="5" fill="#94a3b8"/>
      <circle cx="360" cy="246" r="7" fill="url(#marca)"/>
      <rect x="378" y="239" width="88" height="10" rx="5" fill="#94a3b8"/>
    </g>
    <rect x="352" y="276" width="136" height="18" rx="9" fill="url(#barra)" fill-opacity="0.15"/>
  </g>
</svg>
